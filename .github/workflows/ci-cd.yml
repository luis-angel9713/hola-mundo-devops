name: CI/CD - Hola Mundo App

# Se ejecuta cada vez que se hace push a la rama main
on:
  push:
    branches: [ main ]

jobs:
  # -------------------------------------------------
  # JOB 1: Instalar dependencias y correr las pruebas
  # -------------------------------------------------
  test:
    name: Instalar dependencias y ejecutar pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas unitarias
        run: npm test

  # -------------------------------------------------
  # JOB 2: Construir y subir la imagen a Docker Hub
  # (solo corre si el job "test" pasó correctamente)
  # -------------------------------------------------
  docker:
    name: Build y push de la imagen Docker
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push de la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/hola-mundo-app:latest

  # -------------------------------------------------
  # JOB 3: Desplegar a producción (Render)
  # (solo corre si el job "docker" terminó bien)
  # -------------------------------------------------
  deploy:
    name: Desplegar en Render
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Disparar el deploy en Render
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
